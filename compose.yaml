services:
  valkey:
    image: docker.io/valkey/valkey:8.1.3
    ports:
      - "6379:6379"
    command: ["--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 15

volumes:
  valkey-data:
