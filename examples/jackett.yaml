# Routed play deployable: generated StatefulSet, Service, HTTPRoute, and Argo
# Applications only. Human overlays live next to this file under jackett/
# (PUID/PGID, config VCT).
apiVersion: deploybot.kcloud.io/v1alpha1
kind: Deployable
metadata:
  name: jackett
spec:
  namespace: play
  group: play
  summary: Torrent indexer proxy
  links:
    repoURL: https://github.com/linuxserver/docker-jackett
  git:
    repoURL: https://github.com/ianunruh/kcloud-ops
    workloadPath: k8s/play/jackett
    applicationPath: k8s/apps/projects/play
  argo:
    project: play
    name: play-jackett
  image:
    repository: docker.io/linuxserver/jackett
    tag: v0.22.2037-ls67
  update:
    auto: 24h
  workload:
    kind: StatefulSet
    containerName: jackett
    containerPort: 9117
    portName: http
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
  route:
    port: 9117
    gatewayNamespace: envoy-gateway-system
  stages:
    - name: homelab
      hostname: jackett.k8s.kcloud.zone
      gateway:
        name: internal
        sectionName: https
    - name: prod
      hostname: jackett.k8s.kcloud.io
      gateway:
        name: internal
        sectionName: https
      promote:
        after:
          - approval
