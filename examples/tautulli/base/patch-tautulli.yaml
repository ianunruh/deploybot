apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tautulli
spec:
  template:
    spec:
      containers:
        - name: tautulli
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
