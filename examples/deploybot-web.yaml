# Routed deployable: generated Deployment, Service, HTTPRoute, and Argo
# Applications. Human overlay patch-web.yaml sets DEPLOYBOT_API_URL.
# Edge SSO lives next to this file under deploybot-web/overlays/{homelab,prod}/
# edge-sso/; list that dir on each overlay kustomization so reconcile keeps it.
# Register each hostname's /oauth2/callback on the Dex gateway-sso client.
apiVersion: deploybot.kcloud.io/v1alpha1
kind: Deployable
metadata:
  name: deploybot-web
spec:
  namespace: deploybot-system
  summary: deploybot web console
  links:
    repoURL: https://github.com/ianunruh/deploybot
    source: true
    projectURL: https://trello.com/b/rPALXxJF/kcloud
  git:
    repoURL: https://github.com/ianunruh/kcloud-ops
    workloadPath: k8s/deploybot-web
    applicationPath: k8s/apps/projects/sandbox
  argo:
    project: sandbox
    createNamespace: true
    generatePaths:
      - /k8s/edge-sso
  image:
    repository: ghcr.io/ianunruh/deploybot-web
    tag: main
    pullSecrets:
      - ghcr-auth
  workload:
    kind: Deployment
    replicas: 1
    containerName: web
    containerPort: 3000
    portName: http
    probes:
      path: /healthz
      port: http
      startup:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 30
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 15
      readiness:
        periodSeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  route:
    port: 3000
    timeout: 3600s
    gatewayNamespace: envoy-gateway-system
  stages:
    - name: homelab
      hostname: deploy.k8s.kcloud.zone
      gateway:
        name: internal
        sectionName: https
    - name: prod
      hostname: deploy.k8s.kcloud.io
      gateway:
        name: external
        sectionName: https
      promote:
        after:
          - approval
