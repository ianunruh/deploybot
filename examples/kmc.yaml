# Routed deployable: generated Deployment, Service, HTTPRoute, and Argo
# Applications only. Human overlays live next to this file under kmc/ (env,
# clusters volume). Prod cluster-token mount is overlay-owned. ConfigMaps,
# secrets, and clusters.yaml stay in the ops repo; sync keeps those extra files.
apiVersion: deploybot.kcloud.io/v1alpha1
kind: Deployable
metadata:
  name: kmc
spec:
  namespace: kmc-system
  links:
    repoURL: https://github.com/ianunruh/kmc
    source: true
    projectURL: https://trello.com/b/rPALXxJF/kcloud
  git:
    repoURL: https://github.com/ianunruh/kcloud-ops
    workloadPath: k8s/kmc
    applicationPath: k8s/apps/projects/sandbox
  argo:
    project: sandbox
    createNamespace: true
  image:
    repository: ghcr.io/ianunruh/kmc
    tag: main
    pullSecrets:
      - ghcr-auth
  workload:
    kind: Deployment
    replicas: 1
    serviceAccountName: kmc
    containerName: web
    containerPort: 3000
    portName: http
    probes:
      path: /login
      port: http
      startup:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 30
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 15
      readiness:
        periodSeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  route:
    port: 3000
    timeout: 3600s
    gatewayNamespace: envoy-gateway-system
  stages:
    - name: homelab
      hostname: console.kcloud.zone
      gateway:
        name: internal
        sectionName: https-public
    - name: prod
      hostname: console.kcloud.io
      gateway:
        name: external
        sectionName: https-public
      promote:
        after:
          - approval
