apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmc-controller
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --cluster-pod-cidrs=10.19.0.0/16
            - --cluster-service-cidrs=10.20.0.0/16
